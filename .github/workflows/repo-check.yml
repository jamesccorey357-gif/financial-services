name: repo-check

# Runs the same checks CLAUDE.md asks contributors to run before committing:
# manifest lint + cross-file references + skill-bundle drift (check.py), and a
# dry-run of every managed-agent cookbook (test-cookbooks.sh). No API key is
# needed -- the cookbook test never calls the API.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lint manifests, references, and skill drift
        run: python3 scripts/check.py

      - name: Dry-run every managed-agent cookbook
        run: bash scripts/test-cookbooks.sh
