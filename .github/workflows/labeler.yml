name: labeler

# Labels PRs by area based on changed paths (rules in .github/labeler.yml).
# pull_request_target so fork PRs can be labeled; it never checks out PR code.

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
