name: claude

# Mention @claude in an issue, PR comment, or PR review to have Claude Code
# answer questions, review changes, or push fixes to the branch.
# Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret (from `claude setup-token`,
# uses a Claude Pro/Max subscription instead of API billing).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only respond to collaborators so outside users can't spend API credits.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
           github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CLAUDE.md is picked up automatically; let Claude run the repo checks.
          claude_args: |
            --allowedTools "Bash(python3 scripts/check.py),Bash(python3 scripts/sync-agent-skills.py),Bash(bash scripts/test-cookbooks.sh),Bash(pip install pyyaml)"
